name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Tap checkout
        run: brew tap thurstonsand/ghosttykit "$GITHUB_WORKSPACE"
      - name: Audit formulae
        run: brew audit --strict --online thurstonsand/ghosttykit/ghosttykit-nightly
      - name: Install nightly formula
        run: brew install thurstonsand/ghosttykit/ghosttykit-nightly
      - name: Test nightly formula
        run: brew test thurstonsand/ghosttykit/ghosttykit-nightly
