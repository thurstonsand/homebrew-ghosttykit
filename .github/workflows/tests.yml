name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate tap migrations
        run: |
          jq -e '.ghosttykit == "thurstonsand/tap"' tap_migrations.json
          jq -e '."ghosttykit-nightly" == "thurstonsand/tap"' tap_migrations.json
